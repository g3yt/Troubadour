apply plugin: 'com.android.application'

android {
    compileSdkVersion 28 // Use a recent compile SDK but target older
    defaultConfig {
        applicationId "com.troubadour.app"
        minSdkVersion 9
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
        // Enable NDK build
        externalNativeBuild {
            ndk {
                // We'll configure later
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // For NDK
    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }
    // Enable Java 8 features if needed
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // OkHttp for HTTP client
    implementation 'com.squareup.okhttp3:okhttp:3.12.0' // Check compatibility with API 9
    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.8.0'
    // Android Support Library for older APIs (if needed)
    implementation 'com.android.support:appcompat-v7:28.0.0'
    // For RecyclerView
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    // ExoPlayer for adaptive streaming (requires API 16+)
    // If targeting API 9, we would need to use MediaPlayer with custom adaptive streaming
    // or increase minSdkVersion to 16+
    implementation 'com.google.android.exoplayer:exoplayer:1.5.9'
}