            echo "NDK ${NDK_VERSION} already cached"
          fi

          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${NDK_DIR}" >> $GITHUB_ENV
          echo "${NDK_DIR}" >> $GITHUB_PATH

      - name: Clean build directory (ARMv7)
        working-directory: android/src/main/cpp
