name: Build Android WARP Bypass

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-android-armv7-legacy:
    name: Build Android ARMv7 Legacy (API 14)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache NDK r26d
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-r26d
          key: ndk-r26d-${{ runner.os }}
          restore-keys: |
            ndk-r26d-

      - name: Download and setup NDK r26d
        run: |
          NDK_VERSION=r26d
          NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux-x86_64.zip"
          NDK_DIR="${HOME}/android-ndk-${NDK_VERSION}"

          if [ ! -d "${NDK_DIR}" ]; then
            echo "Downloading NDK ${NDK_VERSION}..."
            curl -L -o /tmp/ndk.zip "${NDK_URL}"
            echo "Extracting NDK..."
            unzip -q /tmp/ndk.zip -d "${HOME}"
            mv "${HOME}/android-ndk-${NDK_VERSION}" "${NDK_DIR}" 2>/dev/null || true
          else
            echo "NDK ${NDK_VERSION} already cached"
          fi

          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${NDK_DIR}" >> $GITHUB_ENV
          echo "${NDK_DIR}" >> $GITHUB_PATH

      - name: Clean build directory (ARMv7 Legacy)
        working-directory: android/src/main/cpp
        run: |
          rm -rf build

      - name: Configure CMake (ARMv7 Legacy / API 14)
        working-directory: android/src/main/cpp
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          echo "Using NDK: $ANDROID_NDK_HOME"
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-14 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: android/src/main/cpp
        run: |
          cmake --build build -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libwarp-android-armv7-legacy
          path: android/src/main/cpp/build/libwarp.so
          retention-days: 7

  build-android-v7a:
